name: Cross-Repo Antigravity Patrol

on:
  # 30分ごとに全リポジトリを自動巡回
  schedule:
    - cron: '*/30 * * * *'
  # GitHubの「Actions」タブから手動で即座に実行できるボタンを追加
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    # 巡回が重なって二重起動しないようにロックをかける
    concurrency:
      group: antigravity-patrol
      cancel-in-progress: false

    steps:
      - name: 司令塔リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Pythonのセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: pip install -U google-genai

      - name: 全リポジトリのIssue巡回・自動修正を実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python scan_and_fix.py