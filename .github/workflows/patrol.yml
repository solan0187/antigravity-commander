name: Cross-Repo Antigravity Patrol

on:
  schedule:
    # 15分おきに自動巡回（投入と完了回収を完全自動化する）
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: antigravity-patrol
      cancel-in-progress: false

    steps:
      - name: 司令塔リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Pythonのセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: ユニットテストの実行
        run: python -m unittest -v test_scan_and_fix.py

      - name: 全リポジトリのIssue巡回・自動修正を実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python scan_and_fix.py