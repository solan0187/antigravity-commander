name: Cross-Repo Antigravity Patrol

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    concurrency:
      group: antigravity-patrol
      cancel-in-progress: false

    steps:
      - name: 司令塔リポジトリのチェックアウト
        uses: actions/checkout@v5

      - name: Pythonのセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 全リポジトリのIssue巡回・自動修正を実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: python scan_and_fix.py